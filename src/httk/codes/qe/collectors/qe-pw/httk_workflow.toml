# Recognizes finished free-standing pw.x runs in any directory tree; collected, never run.

[workflow]
name = "qe.calculation.pw"
description = "a finished pw.x calculation found in a directory tree"

[workflow.recognize]
file = "recognize.py"
priority = 10
requires = ["*.out"]

[workflow.outputs.total_energy]
entry_type = "records"
role = "total_energy"
ref = "https://schemas.httk.org/defs/v0.1/properties/core/total_energy"
description = "The converged total energy of the calculation, in eV."

[workflow.collect]
file = "collect.py"
